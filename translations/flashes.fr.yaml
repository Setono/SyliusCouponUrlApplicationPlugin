    coupon_applied_not_fulfilled: Le code de réduction est enregistré dans votre panier, mais la réduction n'est pas encore active car votre panier ne contient pas les articles, montants ou ne remplit pas les autres critères requis par le code. Lisez les critères du code de réduction à l'endroit où vous l'avez reçu (e-mail, newsletter ou autre)
