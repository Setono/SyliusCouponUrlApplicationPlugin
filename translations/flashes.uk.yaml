setono_sylius_coupon_url_application:
    coupon_applied: Код купона тепер активовано у вашому кошику
    coupon_applied_not_fulfilled: Код купона збережено у вашому кошику, але знижка ще не активна, оскільки ваш кошик не містить товарів, сум або не відповідає іншим критеріям, які вимагає купон. Прочитайте про критерії коду купона там, де ви його отримали (електронна пошта, розсилка чи інше)
    coupon_not_eligible: Код купона більше недійсний. Це може бути через те, що термін його дії закінчився, його ліміт використання вичерпано або з іншої причини
