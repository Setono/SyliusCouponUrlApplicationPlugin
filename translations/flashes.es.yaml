setono_sylius_coupon_url_application:
    coupon_applied: El código de cupón ya está activado en su carrito
    coupon_applied_not_fulfilled: El código de cupón está guardado en su carrito, pero el descuento aún no está activo porque su carrito no contiene los artículos, importes o no cumple los demás criterios requeridos por el cupón. Lea sobre los criterios del código de cupón donde lo recibió (correo electrónico, boletín u otro)
    coupon_not_eligible: El código de cupón ya no es válido. Esto puede deberse a que ha caducado, ha agotado su límite de uso u otro motivo
