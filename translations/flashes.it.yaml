setono_sylius_coupon_url_application:
    coupon_applied: Il codice coupon è ora attivato nel tuo carrello
    coupon_applied_not_fulfilled: Il codice coupon è salvato nel tuo carrello, ma lo sconto non è ancora attivo perché il tuo carrello non contiene gli articoli, gli importi o non soddisfa gli altri criteri richiesti dal coupon. Leggi i criteri del codice coupon dove lo hai ricevuto (email, newsletter o altro)
    coupon_not_eligible: Il codice coupon non è più valido. Questo può essere dovuto al fatto che è scaduto, ha esaurito il suo limite di utilizzo o per qualche altro motivo
