setono_sylius_coupon_url_application:
    coupon_applied: Rabattkoden er nå aktivert i handlekurven din
    coupon_applied_not_fulfilled: Rabattkoden er lagret i handlekurven din, men rabatten er ikke aktiv ennå fordi handlekurven din ikke inneholder varene, beløpene eller oppfyller andre kriterier som rabattkoden krever. Les om kriteriene for rabattkoden der du mottok den (e-post, nyhetsbrev eller annet)
